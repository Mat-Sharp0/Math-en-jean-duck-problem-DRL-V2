name: Build & Release Duck AI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 2.0.0)'
        required: true
        type: string
      build_target:
        description: 'Build target'
        required: true
        type: choice
        options:
          - 'CPU + CUDA'
          - 'CPU only'
          - 'CUDA only'

jobs:
  build-windows-cpu:
    if: inputs.build_target == 'CPU + CUDA' || inputs.build_target == 'CPU only'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      os: windows-latest
      variant: cpu
      requirements: requirements-cpu.txt
      artifact_name: DuckAI_windows_cpu
      installer_suffix: windows_cpu_setup.exe

  build-windows-cuda:
    if: inputs.build_target == 'CPU + CUDA' || inputs.build_target == 'CUDA only'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      os: windows-latest
      variant: cuda
      requirements: requirements-cuda.txt
      artifact_name: DuckAI_windows_cuda
      installer_suffix: windows_cuda_setup.exe

  build-linux-cpu:
    if: inputs.build_target == 'CPU + CUDA' || inputs.build_target == 'CPU only'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      os: ubuntu-latest
      variant: cpu
      requirements: requirements-cpu.txt
      artifact_name: DuckAI_linux_cpu
      installer_suffix: linux_cpu.deb

  build-linux-cuda:
    if: inputs.build_target == 'CPU + CUDA' || inputs.build_target == 'CUDA only'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      os: ubuntu-latest
      variant: cuda
      requirements: requirements-cuda.txt
      artifact_name: DuckAI_linux_cuda
      installer_suffix: linux_cuda.deb

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-cpu, build-windows-cuda, build-linux-cpu, build-linux-cuda]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Duck AI v${{ inputs.version }}
          draft: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}