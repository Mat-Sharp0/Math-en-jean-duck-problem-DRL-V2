meta:
  run_name: "default_td3"
  version: "1.0.0"

algo: TD3
policy: MlpPolicy
device: auto
render_mode: null

env:
  duck_speed: 1.0
  wolf_speed: 2.0

training:
  n_envs: 1
  total_timesteps: 1_000_000

log:
  verbose: 1

hyperparameters:
  learning_rate: 0.0003
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  learning_starts: 10000
  buffer_size: 500000
  train_freq: 1
  gradient_steps: 1
  reward_scale: 1.0
