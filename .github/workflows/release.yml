name: Build & Release Duck AI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.0)'
        required: true
      build_target:
        description: 'Cible de build'
        required: true
        type: choice
        options: ['ALL', 'CPU only', 'CUDA only']

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: python
        run: |
          import json, os
          
          targets = [
              {"os": "windows-latest", "var": "cpu", "req": "requirements-cpu.txt", "name": "windows_cpu_setup"},
              {"os": "windows-latest", "var": "cuda", "req": "requirements-cuda.txt", "name": "windows_cuda_setup"},
              {"os": "ubuntu-latest", "var": "cpu", "req": "requirements-cpu.txt", "name": "linux_cpu"},
              {"os": "ubuntu-latest", "var": "cuda", "req": "requirements-cuda.txt", "name": "linux_cuda"}
          ]
          
          mode = "${{ github.event.inputs.build_target }}"
          ver = "${{ github.event.inputs.version }}"
          
          filtered = targets
          if mode == 'CPU only':
              filtered = [t for t in targets if t['var'] == 'cpu']
          elif mode == 'CUDA only':
              filtered = [t for t in targets if t['var'] == 'cuda']
          
          for t in filtered: t['ver'] = ver
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps({"include": filtered})}\n')

  build:
    needs: compute-matrix
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/build.yml
    with:
      target_config: ${{ toJSON(matrix) }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts/
          merge-multiple: true

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'artifacts/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Duck AI v${{ github.event.inputs.version }}
          files: artifacts/*
          draft: true
          generate_release_notes: true